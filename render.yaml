services:
  - type: web
    name: mahfooz-restaurant
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: ALLOW_SQLITE_FALLBACK
        value: "True"
      - key: SECRET_KEY
        generateValue: true
